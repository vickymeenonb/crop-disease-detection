data:
  root: data/raw
  image_size: 224
  val_split: 0.15
  test_split: 0.15
  num_workers: 4
  seed: 42

model:
  name: resnet50
  pretrained: true
  freeze_backbone: false

training:
  epochs: 20
  batch_size: 32
  learning_rate: 0.0003
  weight_decay: 0.0001
  patience: 4
  device: auto
  output_dir: artifacts
